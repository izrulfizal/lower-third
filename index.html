<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nilai University Convocation Lower Third
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ===================================================
         LOWER THIRD
    ==================================================== -->

    <div
        id="lowerThird"
        class="lower-third hidden"
    >

        <!-- Decorative green bar -->

        <div class="accent-bar"></div>


        <!-- University logo -->

        <div class="logo-area">

            <img
                src="convologo.png"
                alt="Nilai University"
            >

        </div>


        <!-- Graduate information -->

        <div class="graduate-info">

            <div class="meta-row">
                <span
                    id="award"
                    class="award hidden-element"
                >
                    DISTINCTION
                </span>

            </div>


            <div
                id="studentName"
                class="student-name"
            >
                ROS ADEENA ALLISYA BINTI MOHD ZULKIFLI
            </div>


            <div class="details">

                <span id="programme">
                    DIN
                </span>

                <span class="separator">
                    •
                </span>

                <span id="country">
                    MALAYSIA
                </span>

            </div>

        </div>


        <!-- decorative edge -->

        <div class="right-decoration"></div>

    </div>


    <!-- ===================================================
         SUPABASE
    ==================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
